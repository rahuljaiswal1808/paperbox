name: Deploy to GitHub Pages

# Paperbox builds to a static bundle with no backend, so Pages can host it as-is.
# Enable it once under Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that every push to the default branch redeploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # `npm ci` also vendors pdf.js's runtime assets into public/pdfjs via the
      # postinstall hook, which is what the service worker precaches.
      - run: npm ci

      - run: npm run lint

      - name: Build
        env:
          # "/paperbox" for a project site, empty for a user/org site.
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A green deploy does not prove the site serves what we built. If Pages is
      # set to "Deploy from a branch" the repository root is published instead,
      # so visitors get the unbuilt index.html — which references /src/main.tsx,
      # loads nothing, and looks like a broken app rather than a misconfigured
      # one. Check the published page and fail loudly if that is what is live.
      - name: Verify the published site is the built app
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsSL --max-time 30 "$url" || true)
            if printf '%s' "$body" | grep -q 'assets/index-.*\.js'; then
              echo "OK: the built bundle is being served."
              exit 0
            fi
            echo "attempt $attempt: not serving the built bundle yet, waiting..."
            sleep 10
          done
          echo "::error::$url is not serving the built app."
          if printf '%s' "$body" | grep -q 'src/main.tsx'; then
            echo "::error::It is serving the repository's raw source instead."
            echo "::error::Set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions'."
          fi
          printf '%s' "$body" | head -c 600
          exit 1
